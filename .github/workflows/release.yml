name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v1.2.0 (required for manual runs)'
        type: string
        required: true
      build_ios:
        description: 'Also build unsigned iOS IPA (experimental)'
        type: boolean
        default: false
      signing:
        description: 'Signing key. "debug" keeps existing debug-signed installs updatable (no data loss).'
        type: choice
        default: release
        options:
          - release
          - debug

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # versionCode comes from the commit count
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm ci
      - name: Stamp versionCode
        run: |
          if [ -n "${{ inputs.tag }}" ] || [ "${{ github.ref_type }}" = "tag" ]; then
            node scripts/set-version-code.js --tag "$RELEASE_TAG"
          else
            node scripts/set-version-code.js --from-git
          fi
      - run: npx expo prebuild --platform android --no-install
      - name: Decode release keystore
        if: ${{ inputs.signing != 'debug' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.BOOKIE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing BOOKIE_KEYSTORE_BASE64 secret. Refusing to ship a debug-signed APK."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/bookie-release.keystore"
          echo "BOOKIE_KEYSTORE_PATH=$RUNNER_TEMP/bookie-release.keystore" >> "$GITHUB_ENV"
      - name: Sign with the debug keystore
        if: ${{ inputs.signing == 'debug' }}
        run: |
          echo "::warning::Signing with android/app/debug.keystore (Expo's public key)."
          echo "This matches the v1.1.0 release, so it updates in place and keeps user data."
      - name: Build release APK
        working-directory: android
        env:
          BOOKIE_KEYSTORE_PASSWORD: ${{ secrets.BOOKIE_KEYSTORE_PASSWORD }}
          BOOKIE_KEY_ALIAS: ${{ secrets.BOOKIE_KEY_ALIAS }}
          BOOKIE_KEY_PASSWORD: ${{ secrets.BOOKIE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon
      - name: Rename APK
        run: |
          SUFFIX=""
          [ "${{ inputs.signing }}" = "debug" ] && SUFFIX="-debugkey"
          cp android/app/build/outputs/apk/release/app-release.apk "Bookie-${RELEASE_TAG}${SUFFIX}.apk"
      - uses: actions/upload-artifact@v4
        with: { name: android, path: Bookie-*.apk }

  ios:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_ios }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx expo prebuild --platform ios
      - name: Build unsigned app
        working-directory: ios
        run: |
          WS=$(ls -d *.xcworkspace | head -1); SCHEME="${WS%.xcworkspace}"
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release \
            -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package unsigned IPA
        run: |
          APP=$(ls -d ios/build/Build/Products/Release-iphoneos/*.app | head -1)
          mkdir Payload && cp -R "$APP" Payload/
          zip -qr "Bookie-${RELEASE_TAG}-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v4
        with: { name: ios, path: Bookie-*.ipa }

  release:
    needs: [android, ios]
    if: ${{ !cancelled() && needs.android.result == 'success' && (needs.ios.result == 'success' || needs.ios.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: artifacts/*
